<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>百米值转十米值｜批处理</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
body{margin:0;background:#f4f7f8;color:#17324d;font:16px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1000px;margin:42px auto;padding:0 20px}h1{margin:0;font-size:30px}.lead{color:#52687a}.card{margin:18px 0;padding:24px;background:#fff;border:1px solid #d7e2e8;border-radius:14px}.ranges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.range{padding:14px;border:1px solid #d7e2e8;border-radius:9px}.range b{display:block;margin-bottom:10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-size:13px;color:#52687a;font-weight:650}input{width:100%;box-sizing:border-box;margin-top:5px;padding:9px;border:1px solid #b9c8d3;border-radius:7px;font:inherit;color:#17324d}button{margin-top:18px;padding:11px 20px;border:0;border-radius:8px;background:#176b87;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}#status{white-space:pre-wrap}.ok{color:#087264}.bad{color:#b42318}.privacy{color:#087264;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid #d7e2e8}th{background:#edf5f8}.scroll{overflow:auto}@media(max-width:700px){main{margin:24px auto}.ranges{grid-template-columns:1fr}}
</style></head><body><main>
<h1>百米值转十米值 · 批处理</h1><p class="lead">一次选择多个Excel，使用同一套指标范围生成结果。<span class="privacy">全部在浏览器本地处理，不上传文件。</span></p>
<section class="card"><label>选择一个或多个 .xlsx 文件<input id="files" type="file" multiple accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label><p id="selected">尚未选择文件</p></section>
<section class="card"><b>三项指标随机波动范围</b><div class="ranges"><div class="range"><b>IRI</b><div class="pair"><label>最小倍数<input id="imin" type="number" value="0.75" min="0" step="0.01"></label><label>最大倍数<input id="imax" type="number" value="1.25" min="0" step="0.01"></label></div></div><div class="range"><b>车辙</b><div class="pair"><label>最小倍数<input id="rmin" type="number" value="0.75" min="0" step="0.01"></label><label>最大倍数<input id="rmax" type="number" value="1.25" min="0" step="0.01"></label></div></div><div class="range"><b>SFC</b><div class="pair"><label>最小倍数<input id="smin" type="number" value="0.75" min="0" step="0.01"></label><label>最大倍数<input id="smax" type="number" value="1.25" min="0" step="0.01"></label></div></div></div><label style="max-width:230px;margin-top:16px">随机种子（可选）<input id="seed" type="number" placeholder="留空则每次不同"></label><button id="run" disabled>批量生成并下载 ZIP</button><p>每个文件独立预检。成功文件写入ZIP；失败文件不会生成10m成果，但会在ZIP的“批处理汇总.xlsx”中列出原因。</p></section>
<section id="result" class="card" hidden><b>处理结果</b><p id="status"></p><div class="scroll" id="table"></div></section>
</main><script>
(()=>{const $=x=>document.getElementById(x),reserved=['10','校验结果','数据预检','参数设置'],round=(v,d)=>Math.floor(v*10**d+.5+1e-9)/10**d;let files=[];
const rng=()=>{const s=$('seed').value.trim();if(!s)return Math.random;let a=Number(s)>>>0;return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}};const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
function limits(){const x=[["IRI",'imin','imax'],["车辙",'rmin','rmax'],['SFC','smin','smax']],o={};for(const[n,a,b]of x){let min=+$(a).value,max=+$(b).value;if(!Number.isFinite(min)||!Number.isFinite(max)||min<0||min>max)throw Error(`${n}范围必须满足 0 ≤ 最小倍数 ≤ 最大倍数`);o[n]={min,max}}return o}
function split(a,b){let o=[];while(a<b){let n=Math.min((Math.floor(a/10)+1)*10,b);o.push([a,n]);a=n}return o}function shape(v){if(v.length<3)return true;let d=v.slice(1).map((x,i)=>x-v[i]);return !(d.every(x=>x>=0)||d.every(x=>x<=0)||d.every(x=>x===d[0]))}
function make(base,n,d,range,r){let z=10**d,b=Math.round(base*z),lo=Math.ceil(base*range.min*z-1e-8),hi=Math.floor(base*range.max*z+1e-8);if(lo>b||hi<b)throw Error(`基准值 ${base} 未处于设定区间`);if(n===1||lo===hi)return Array(n).fill(b);let mn=Math.max(-Math.floor(n/2),n*(lo-b)),mx=Math.min(Math.floor((n-1)/2),n*(hi-b)),os=[];for(let i=mn;i<=mx;i++)if(i)os.push(i);let off=os.length?os[ri(r,0,os.length-1)]:0;for(let k=0;k<500;k++){let v=Array(n).fill(b),left=Math.abs(off),sign=Math.sign(off)||1;while(left){let c=v.map((x,i)=>[i,sign>0?hi-x:x-lo]).filter(x=>x[1]>0);if(!c.length)break;let q=c[ri(r,0,c.length-1)],m=ri(r,1,Math.min(q[1],left));v[q[0]]+=sign*m;left-=m}if(left)continue;for(let q=0;q<Math.max(12,n*5);q++){let a=ri(r,0,n-1),b2=ri(r,0,n-2);if(b2>=a)b2++;let m=Math.min(hi-v[a],v[b2]-lo);if(m){m=ri(r,1,m);v[a]+=m;v[b2]-=m}}for(let i=n-1;i;i--){let j=ri(r,0,i);[v[i],v[j]]=[v[j],v[i]]}if(new Set(v).size>1&&shape(v))return v}throw Error('500次内未得到符合形态约束的随机组')}
function rows(ws){let a=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true}),e=[],h=a[0]||[];['开始桩号','结束桩号','IRI','车辙','SFC'].forEach((x,i)=>{if(!String(h[i]??'').includes(x))e.push(`表头第${i+1}列应包含${x}`)});let out=[];a.slice(1).forEach((q,i)=>{let r=i+2;if(!q.slice(0,5).some(x=>x!==null&&x!==''))return;if(q.slice(0,5).some(x=>x===null||x===''))return e.push(`第${r}行存在空值`);let [start,end,iri,rut,sfc]=q.map(Number);if(!Number.isInteger(start)||!Number.isInteger(end)||start>=end||![iri,rut,sfc].every(Number.isFinite)||iri<0||rut<0||sfc<0||!Number.isInteger(sfc))return e.push(`第${r}行格式不合法`);out.push({r,start,end,iri,rut,sfc})});out.forEach((x,i)=>{if(i&&x.start!==out[i-1].end)e.push(`第${x.r}行桩号不连续`);if(i&&i<out.length-1&&x.end-x.start!==100)e.push(`第${x.r}行长度不是100m`)});return{h,out,e}}
function del(w,n){let i=w.SheetNames.indexOf(n);if(i>=0)w.SheetNames.splice(i,1);delete w.Sheets[n]}function add(w,n,a,widths){del(w,n);let s=XLSX.utils.aoa_to_sheet(a);s['!cols']=widths.map(w=>({wch:w}));s['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:a.length-1,c:a[0].length-1}})};w.SheetNames.push(n);w.Sheets[n]=s;return s}
function process(buffer,limit,r){let w=XLSX.read(buffer,{cellStyles:true,cellFormula:true}),name=w.SheetNames.find(x=>!reserved.includes(x));if(!name)throw Error('未找到源工作表');let {h,out,e}=rows(w.Sheets[name]);if(e.length)throw Error(e.join('；'));let ten=[h.slice(0,5)],checks=[['原始Excel行','开始桩号','结束桩号','拆分段数','IRI原值','IRI平均值（未舍入）','IRI反算','IRI结论','车辙原值','车辙平均值（未舍入）','车辙反算','车辙结论','SFC原值','SFC平均值（未舍入）','SFC反算','SFC结论','总体结论','备注']];for(let x of out){let p=split(x.start,x.end),i=make(x.iri,p.length,2,limit.IRI,r),u=make(x.rut,p.length,2,limit.车辙,r),s=make(x.sfc,p.length,0,limit.SFC,r);p.forEach((q,k)=>ten.push([q[0],q[1],i[k]/100,u[k]/100,s[k]]));let ia=i.reduce((a,b)=>a+b,0)/100/p.length,ua=u.reduce((a,b)=>a+b,0)/100/p.length,sa=s.reduce((a,b)=>a+b,0)/p.length,ok=round(ia,2)===round(x.iri,2)&&round(ua,2)===round(x.rut,2)&&round(sa,0)===x.sfc;checks.push([x.r,x.start,x.end,p.length,x.iri,ia,round(ia,2),round(ia,2)===round(x.iri,2)?'通过':'失败',x.rut,ua,round(ua,2),round(ua,2)===round(x.rut,2)?'通过':'失败',x.sfc,sa,round(sa,0),round(sa,0)===x.sfc?'通过':'失败',ok?'通过':'失败',ok?'':'反算未还原'])}let t=add(w,'10',ten,[15,15,14,14,14]);for(let c of ['C','D'])for(let n=2;n<=ten.length;n++)if(t[c+n])t[c+n].z='0.00';let c=add(w,'校验结果',checks,[12,14,14,10,12,20,12,10,12,20,12,10,12,20,12,10,12,20]);for(let col of ['E','G','I','K'])for(let n=2;n<=checks.length;n++)if(c[col+n])c[col+n].z='0.00';for(let col of ['F','J','N'])for(let n=2;n<=checks.length;n++)if(c[col+n])c[col+n].z='0.00000';add(w,'数据预检',[['项目','结果'],['源工作表',name],['有效数据行数',out.length],['预检结论','通过'],[],['Excel行号','问题'],['-','未发现输入数据问题']],[18,72]);return{data:XLSX.write(w,{bookType:'xlsx',type:'array',cellStyles:true}),units:out.length,records:ten.length-1}}
$('files').onchange=e=>{files=[...e.target.files];$('selected').textContent=files.length?`已选择 ${files.length} 个文件：${files.map(x=>x.name).join('、')}`:'尚未选择文件';$('run').disabled=!files.length};$('run').onclick=async()=>{try{let l=limits(),r=rng(),zip=new JSZip(),sum=[['源文件','处理结果','原始单元数','10m记录数','说明']],done=0;$('run').disabled=true;for(let f of files){try{let z=process(await f.arrayBuffer(),l,r);zip.file(f.name.replace(/\.[^.]+$/,'')+'_10m.xlsx',z.data);sum.push([f.name,'成功',z.units,z.records,'全部反算通过']);done++}catch(err){sum.push([f.name,'失败','','',err.message])}}let sw=XLSX.utils.book_new();XLSX.utils.book_append_sheet(sw,XLSX.utils.aoa_to_sheet(sum),'批处理汇总');zip.file('批处理汇总.xlsx',XLSX.write(sw,{bookType:'xlsx',type:'array'}));let blob=await zip.generateAsync({type:'blob'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='百米值转十米值_批处理结果.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);$('result').hidden=false;$('status').className=done===files.length?'ok':'bad';$('status').textContent=`已处理 ${files.length} 个文件：成功 ${done} 个，失败 ${files.length-done} 个。ZIP已开始下载。`;$('table').innerHTML='<table>'+sum.map((x,i)=>`<tr>${x.map(v=>`<${i?'td':'th'}>${String(v).replaceAll('&','&amp;').replaceAll('<','&lt;')}</${i?'td':'th'}>`).join('')}</tr>`).join('')+'</table>'}catch(e){$('result').hidden=false;$('status').className='bad';$('status').textContent='批处理失败：'+e.message}finally{$('run').disabled=!files.length}}})();
</script></body></html>
